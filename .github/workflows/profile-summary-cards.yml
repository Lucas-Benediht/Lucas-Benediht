name: Update Profile Summary Cards

on:
  schedule:
    # Runs daily at 03:00 UTC (00:00 BRT)
    - cron: "0 3 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/profile-summary-cards.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    name: Generate adaptive GitHub summary cards
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Generate Light Mode Cards (github)
        uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          USERNAME: ${{ github.repository_owner }}
          THEME: github
          TIME_ZONE: America/Sao_Paulo
          NAME: Lucas Benediht (Benee)
          AUTO_PUSH: false

      - name: Preserve Light Mode Output
        run: |
          mkdir -p /tmp/card-themes
          cp -r profile-summary-card-output/github /tmp/card-themes/github

      - name: Generate Dark Mode Cards (github_dark)
        uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          USERNAME: ${{ github.repository_owner }}
          THEME: github_dark
          TIME_ZONE: America/Sao_Paulo
          NAME: Lucas Benediht (Benee)
          AUTO_PUSH: false

      - name: Restore Light Mode Output & Commit Both Themes
        run: |
          cp -r /tmp/card-themes/github profile-summary-card-output/github
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile-summary-card-output
          if ! git diff --cached --quiet; then
            git commit -m "chore: update profile summary cards"
            git push
          else
            echo "No changes to commit."
          fi
