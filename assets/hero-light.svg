<svg width="860" height="220" viewBox="0 0 860 220" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="glow-light" cx="85%" cy="20%" r="65%">
      <stop offset="0%" stop-color="#0969DA" stop-opacity="0.09" />
      <stop offset="55%" stop-color="#8250DF" stop-opacity="0.04" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </radialGradient>
    <pattern id="dots-light" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#D0D7DE" fill-opacity="0.7" />
    </pattern>
  </defs>
  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
    .mono { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.35; }
    }
    .pulse { animation: pulse 2.4s ease-in-out infinite; }
  </style>

  <!-- Main Card -->
  <rect x="1" y="1" width="858" height="218" rx="16" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="1.2" />
  <rect x="1" y="1" width="858" height="218" rx="16" fill="url(#dots-light)" />
  <rect x="1" y="1" width="858" height="218" rx="16" fill="url(#glow-light)" />

  <!-- Top Status -->
  <circle cx="42" cy="40" r="4" fill="#1A7F37" class="pulse" />
  <text x="56" y="44" class="mono" font-size="11" fill="#656D76" letter-spacing="1.1">ONLINE AS BENEE · LONDRINA, BRAZIL</text>

  <!-- Name + Handle Pill -->
  <text x="36" y="96" class="sans" font-size="34" font-weight="700" fill="#1F2328" letter-spacing="-0.5">Lucas Benediht</text>
  <rect x="294" y="72" width="68" height="26" rx="13" fill="#DDF4FF" stroke="#54AEFF" stroke-opacity="0.7" />
  <text x="328" y="89" class="mono" font-size="12" font-weight="600" fill="#0969DA" text-anchor="middle">Benee</text>

  <!-- Role & Company -->
  <text x="36" y="128" class="sans" font-size="14.5" font-weight="500" fill="#24292F">Software Engineer · Back-end (.NET &amp; Angular) &amp; RPA</text>
  <text x="36" y="152" class="sans" font-size="12.5" fill="#656D76">Software Developer Analyst @ Tata Consultancy Services (TCS)</text>

  <!-- Bottom Focus Pills -->
  <rect x="36" y="170" width="104" height="26" rx="8" fill="#F6F8FA" stroke="#D0D7DE" />
  <text x="88" y="187" class="mono" font-size="11" fill="#8250DF" text-anchor="middle">.NET 8/10 · C#</text>

  <rect x="148" y="170" width="144" height="26" rx="8" fill="#F6F8FA" stroke="#D0D7DE" />
  <text x="220" y="187" class="mono" font-size="11" fill="#0969DA" text-anchor="middle">Automation Anywhere</text>

  <rect x="300" y="170" width="166" height="26" rx="8" fill="#F6F8FA" stroke="#D0D7DE" />
  <text x="383" y="187" class="mono" font-size="11" fill="#1A7F37" text-anchor="middle">Power Automate · Python</text>

  <!-- Right Mini IDE Terminal Card -->
  <rect x="502" y="24" width="326" height="172" rx="12" fill="#F6F8FA" stroke="#D0D7DE" stroke-width="1.1" />
  <line x1="502" y1="54" x2="828" y2="54" stroke="#D0D7DE" stroke-width="1" />
  <circle cx="520" cy="39" r="4" fill="#CF222E" fill-opacity="0.75" />
  <circle cx="534" cy="39" r="4" fill="#BF8700" fill-opacity="0.75" />
  <circle cx="548" cy="39" r="4" fill="#1A7F37" fill-opacity="0.75" />
  <text x="665" y="43" class="mono" font-size="11" fill="#656D76" text-anchor="middle">benee.profile.ts</text>

  <text x="518" y="78" class="mono" font-size="11.5">
    <tspan fill="#CF222E">const</tspan><tspan fill="#1F2328"> benee </tspan><tspan fill="#656D76">= {</tspan>
  </text>
  <text x="518" y="100" class="mono" font-size="11.5">
    <tspan fill="#0969DA">  role:</tspan><tspan fill="#0A3069">   "Back-end &amp; RPA Dev"</tspan><tspan fill="#656D76">,</tspan>
  </text>
  <text x="518" y="122" class="mono" font-size="11.5">
    <tspan fill="#0969DA">  stack:</tspan><tspan fill="#0A3069">  [".NET", "Angular", "A360"]</tspan><tspan fill="#656D76">,</tspan>
  </text>
  <text x="518" y="144" class="mono" font-size="11.5">
    <tspan fill="#0969DA">  impact:</tspan><tspan fill="#0A3069"> "50+ bots · 10k+ cases"</tspan><tspan fill="#656D76">,</tspan>
  </text>
  <text x="518" y="166" class="mono" font-size="11.5">
    <tspan fill="#0969DA">  certs:</tspan><tspan fill="#1A7F37">  "Master RPA · PL-500"</tspan>
  </text>
  <text x="518" y="185" class="mono" font-size="11.5" fill="#656D76">};</text>
</svg>
