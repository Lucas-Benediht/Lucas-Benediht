<svg width="860" height="220" viewBox="0 0 860 220" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="glow-dark" cx="85%" cy="20%" r="65%">
      <stop offset="0%" stop-color="#58A6FF" stop-opacity="0.16" />
      <stop offset="55%" stop-color="#A371F7" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#0D1117" stop-opacity="0" />
    </radialGradient>
    <pattern id="dots-dark" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#30363D" fill-opacity="0.45" />
    </pattern>
  </defs>
  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
    .mono { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.35; }
    }
    .pulse { animation: pulse 2.4s ease-in-out infinite; }
  </style>

  <!-- Main Card -->
  <rect x="1" y="1" width="858" height="218" rx="16" fill="#0D1117" stroke="#30363D" stroke-width="1.2" />
  <rect x="1" y="1" width="858" height="218" rx="16" fill="url(#dots-dark)" />
  <rect x="1" y="1" width="858" height="218" rx="16" fill="url(#glow-dark)" />

  <!-- Top Status -->
  <circle cx="42" cy="40" r="4" fill="#3FB950" class="pulse" />
  <text x="56" y="44" class="mono" font-size="11" fill="#8B949E" letter-spacing="1.1">ONLINE AS BENEE · LONDRINA, BRAZIL</text>

  <!-- Name + Handle Pill -->
  <text x="36" y="96" class="sans" font-size="34" font-weight="700" fill="#F0F6FC" letter-spacing="-0.5">Lucas Benediht</text>
  <rect x="294" y="72" width="68" height="26" rx="13" fill="#1F6FEB" fill-opacity="0.18" stroke="#58A6FF" stroke-opacity="0.45" />
  <text x="328" y="89" class="mono" font-size="12" font-weight="600" fill="#79C0FF" text-anchor="middle">Benee</text>

  <!-- Role & Company -->
  <text x="36" y="128" class="sans" font-size="14.5" font-weight="500" fill="#C9D1D9">Software Engineer · Back-end (.NET &amp; Angular) &amp; RPA</text>
  <text x="36" y="152" class="sans" font-size="12.5" fill="#8B949E">Software Developer Analyst @ Tata Consultancy Services (TCS)</text>

  <!-- Bottom Focus Pills -->
  <rect x="36" y="170" width="104" height="26" rx="8" fill="#161B22" stroke="#30363D" />
  <text x="88" y="187" class="mono" font-size="11" fill="#D2A8FF" text-anchor="middle">.NET 8/10 · C#</text>

  <rect x="148" y="170" width="144" height="26" rx="8" fill="#161B22" stroke="#30363D" />
  <text x="220" y="187" class="mono" font-size="11" fill="#79C0FF" text-anchor="middle">Automation Anywhere</text>

  <rect x="300" y="170" width="166" height="26" rx="8" fill="#161B22" stroke="#30363D" />
  <text x="383" y="187" class="mono" font-size="11" fill="#56D364" text-anchor="middle">Power Automate · Python</text>

  <!-- Right Mini IDE Terminal Card -->
  <rect x="502" y="24" width="326" height="172" rx="12" fill="#161B22" stroke="#30363D" stroke-width="1.1" />
  <line x1="502" y1="54" x2="828" y2="54" stroke="#30363D" stroke-width="1" />
  <circle cx="520" cy="39" r="4" fill="#FF7B72" fill-opacity="0.85" />
  <circle cx="534" cy="39" r="4" fill="#D29922" fill-opacity="0.85" />
  <circle cx="548" cy="39" r="4" fill="#3FB950" fill-opacity="0.85" />
  <text x="665" y="43" class="mono" font-size="11" fill="#8B949E" text-anchor="middle">benee.profile.ts</text>

  <text x="518" y="78" class="mono" font-size="11.5">
    <tspan fill="#FF7B72">const</tspan><tspan fill="#F0F6FC"> benee </tspan><tspan fill="#8B949E">= {</tspan>
  </text>
  <text x="518" y="100" class="mono" font-size="11.5">
    <tspan fill="#79C0FF">  role:</tspan><tspan fill="#A5D6FF">   "Back-end &amp; RPA Dev"</tspan><tspan fill="#8B949E">,</tspan>
  </text>
  <text x="518" y="122" class="mono" font-size="11.5">
    <tspan fill="#79C0FF">  stack:</tspan><tspan fill="#A5D6FF">  [".NET", "Angular", "A360"]</tspan><tspan fill="#8B949E">,</tspan>
  </text>
  <text x="518" y="144" class="mono" font-size="11.5">
    <tspan fill="#79C0FF">  impact:</tspan><tspan fill="#A5D6FF"> "50+ bots · 10k+ cases"</tspan><tspan fill="#8B949E">,</tspan>
  </text>
  <text x="518" y="166" class="mono" font-size="11.5">
    <tspan fill="#79C0FF">  certs:</tspan><tspan fill="#56D364">  "Master RPA · PL-500"</tspan>
  </text>
  <text x="518" y="185" class="mono" font-size="11.5" fill="#8B949E">};</text>
</svg>
